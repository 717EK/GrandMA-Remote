<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TDS gMA3 Show View</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101010;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}.bar{padding:10px;display:flex;gap:8px;background:#181818;border-bottom:1px solid #333}
input,button{height:42px;border:1px solid #444;border-radius:9px;background:#242424;color:#fff;padding:0 12px;font-size:15px}
input{flex:1;min-width:0}button{font-weight:600}.frame{flex:1;border:0;width:100%;background:#000}.hint{font-size:11px;color:#aaa;padding:6px 10px;background:#181818}
</style>
</head>
<body>
<div class="bar">
<input id="ip" placeholder="grandMA3 IP e.g. 192.168.1.50" inputmode="decimal">
<button onclick="loadRemote()">SHOW</button>
<button onclick="newTab()">↗</button>
</div>
<div class="hint">This displays the native grandMA3 Web Remote — the show, fixtures, views and controls come directly from grandMA3.</div>
<iframe id="remote" class="frame" allow="fullscreen"></iframe>
<script>
const ip=document.getElementById("ip");
ip.value=localStorage.getItem("gma3ip")||"";
function url(){const v=ip.value.trim();if(!v){alert("Enter the grandMA3 IP.");return null}localStorage.setItem("gma3ip",v);return "http://"+v+":8080/";}
function loadRemote(){const u=url();if(u)document.getElementById("remote").src=u;}
function newTab(){const u=url();if(u)window.open(u,"_blank");}
</script>
</body>
</html>
