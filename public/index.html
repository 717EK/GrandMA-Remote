<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TDS gMA3 Remote</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f10;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:16px;position:sticky;top:0;background:#181818;border-bottom:1px solid #333;z-index:2}
h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;color:#999}main{max-width:760px;margin:auto;padding:12px}
.card{background:#191919;border:1px solid #303030;border-radius:13px;margin-bottom:12px;overflow:hidden}.title{padding:12px;font-weight:700;border-bottom:1px solid #303030}
.row{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #292929}.row:last-child{border-bottom:0}.name{flex:1}.muted{color:#888;font-size:11px}
button{border:1px solid #555;background:#292929;color:white;border-radius:8px;padding:8px 11px;font-weight:700}
#err{color:#ff9f0a;font-size:12px;padding:8px 0}.empty{color:#888;padding:12px}
</style></head><body>
<header><h1>TDS • gMA3 REMOTE</h1><div class="sub" id="status">Connecting…</div></header>
<main>
<div id="err"></div>
<section class="card"><div class="title">Fixtures <span id="count"></span></div><div id="fixtures"></div></section>
<section class="card"><div class="title">Groups</div><div id="groups"></div></section>
<section class="card"><div class="title">Sequences</div><div id="seq"></div></section>
</main>
<script>
let state={fixtureCount:0,fixtures:[],groups:[],sequences:[]};
const key=localStorage.getItem("tdsKey")||"";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 document.querySelector("#count").textContent=state.fixtureCount?`(${state.fixtureCount})`:"";
 document.querySelector("#fixtures").innerHTML=state.fixtures?.length?state.fixtures.map(f=>`
 <div class=row><div class=name>${esc(f.name||"Fixture "+f.index)}<div class=muted>${esc(f.address||"")}</div></div>
 <button onclick="cmd(${Number(f.index)},'on')">ON</button><button onclick="cmd(${Number(f.index)},'off')">OFF</button></div>`).join(""):"<div class=empty>No fixture data yet.</div>";
 document.querySelector("#groups").innerHTML=state.groups?.length?state.groups.map(x=>`<div class=row><div class=name>${esc(x.name||"Group "+x.index)}</div></div>`).join(""):"<div class=empty>No groups.</div>";
 document.querySelector("#seq").innerHTML=state.sequences?.length?state.sequences.map(x=>`<div class=row><div class=name>${esc(x.name||"Sequence "+x.index)}</div></div>`).join(""):"<div class=empty>No sequences.</div>";
}
async function api(action,method="GET",body){
 const r=await fetch("/api/bridge?action="+action,{method,headers:{"Content-Type":"application/json","X-TDS-Key":key},body:body?JSON.stringify(body):undefined});
 if(!r.ok)throw new Error(await r.text());return r.json();
}
async function refresh(){try{state=await api("state");render();document.querySelector("#status").textContent="Connected to TDS bridge";document.querySelector("#err").textContent=""}catch(e){document.querySelector("#status").textContent="Waiting for bridge";document.querySelector("#err").textContent="Bridge not connected yet."}}
async function cmd(id,state){try{await api("command","POST",{id,state})}catch(e){document.querySelector("#err").textContent="Command failed: "+e.message}}
render();refresh();setInterval(refresh,1500);
</script></body></html>
